<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | Skenpat JSON Editor</title>
    <meta name="description"
        content="Panel Admin Skenpat JSON Editor. Kelola data artikel, jadwal, dan informasi portal digital SMKN 4 Banjarmasin secara efisien dalam satu platform.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Quicksand:wght@500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.23.0/ace.js"></script>
    <style>
        :root {
            --primary: #FF9F43;
            --primary-dark: #e67e22;
            --bg: #f8f9fa;
            --card-bg: #ffffff;
            --text-main: #2d3436;
            --text-muted: #636e72;
            --border-color: #dfe6e9;
            --radius: 12px;
            --shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        [data-theme="dark"] {
            --bg: #1a1a1a;
            --card-bg: #2d2d2d;
            --text-main: #f8f9fa;
            --text-muted: #b2bec3;
            --border-color: #404040;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            transition: all 0.3s ease;
        }

        .admin-container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        h1 {
            font-family: 'Fredoka', sans-serif;
            color: var(--primary);
            margin: 0;
        }

        .admin-nav {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            overflow-x: auto;
            padding-bottom: 10px;
        }

        .nav-btn {
            padding: 10px 20px;
            border: none;
            background: var(--card-bg);
            color: var(--text-main);
            border-radius: var(--radius);
            cursor: pointer;
            white-space: nowrap;
            font-weight: 600;
            border: 1px solid var(--border-color);
            transition: all 0.2s;
        }

        .nav-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .editor-card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
        }

        .actions {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            font-family: 'Fredoka', sans-serif;
            transition: transform 0.2s;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-secondary {
            background: var(--text-muted);
            color: white;
        }

        .btn-success {
            background: #27ae60;
            color: white;
        }

        #json-editor {
            width: 100%;
            height: 500px;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            font-size: 14px;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(4px);
        }

        .modal {
            background: var(--card-bg);
            padding: 25px;
            border-radius: var(--radius);
            width: 90%;
            max-width: 500px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .modal h2 {
            margin-top: 0;
            font-family: 'Fredoka', sans-serif;
            color: var(--primary);
        }

        .modal input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin: 15px 0;
            font-family: 'Quicksand', sans-serif;
            background: var(--bg);
            color: var(--text-main);
            box-sizing: border-box;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .btn-custom-api {
            background: #6c5ce7;
            color: white;
        }

        .btn-custom-api:hover {
            background: #5b4bc4;
        }

        #status-msg {
            margin-top: 15px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .file-info {
            margin-bottom: 15px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }
    </style>
</head>

<body>
    <div class="admin-container">
        <header>
            <h1>Skenpat Admin Panel</h1>
            <a href="index.html" style="text-decoration:none; color:var(--primary); font-weight:700;"><i
                    class="fas fa-home"></i> Lihat Situs</a>
        </header>

        <div class="admin-nav">
            <button class="nav-btn active" data-file="search.json">Search Data</button>
            <button class="nav-btn" data-file="articles.json">Articles</button>
            <button class="nav-btn btn-custom-api" id="custom-api-btn"><i class="fas fa-link"></i> Custom API</button>
        </div>

        <div class="editor-card">
            <div class="file-info" id="file-path">Editing: /api/search.json</div>
            <div id="json-editor"></div>

            <div class="actions">
                <button class="btn btn-secondary" id="format-btn">Rapikan JSON</button>
                <button class="btn btn-primary" id="download-btn"><i class="fas fa-download"></i> Simpan &
                    Download</button>
                <div style="flex-grow:1;"></div>
                <input type="file" id="upload-input" style="display:none;" accept=".json">
                <button class="btn btn-success" id="upload-trigger"><i class="fas fa-upload"></i> Unggah File</button>
            </div>
            <div id="status-msg"></div>
        </div>

        <div style="margin-top:20px; font-size:0.8rem; color:var(--text-muted); text-align:center;">
            <p>Petunjuk: Edit konten di atas, lalu tekan Download. Unggah file hasil download ke folder /api/ di
                server/github Anda.</p>
        </div>
    </div>

    <!-- Modal for Custom API -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal">
            <h2>Enter Custom API URL</h2>
            <p>Paste the direct URL to the JSON file you want to edit.</p>
            <input type="text" id="custom-url-input" placeholder="https://example.com/data.json">
            <div class="modal-actions">
                <button class="btn btn-secondary" id="modal-cancel">Cancel</button>
                <button class="btn btn-primary" id="modal-confirm">Load Data</button>
            </div>
        </div>
    </div>

    <script>
        // Initialize Ace Editor
        const aceEditor = ace.edit("json-editor");
        aceEditor.setTheme("ace/theme/tomorrow_night_eighties");
        aceEditor.session.setMode("ace/mode/json");
        aceEditor.setOptions({
            useSoftTabs: true,
            tabSize: 2,
            showPrintMargin: false,
            fontSize: "14px"
        });

        const navBtns = document.querySelectorAll('.nav-btn:not(#custom-api-btn)');
        const customApiBtn = document.getElementById('custom-api-btn');
        const modalOverlay = document.getElementById('modal-overlay');
        const modalCancel = document.getElementById('modal-cancel');
        const modalConfirm = document.getElementById('modal-confirm');
        const customUrlInput = document.getElementById('custom-url-input');
        const statusMsg = document.getElementById('status-msg');
        const filePathDisplay = document.getElementById('file-path');
        let currentFile = 'search.json';

        // Load File logic
        const loadFile = async (url, filename) => {
            currentFile = filename || 'custom.json';
            filePathDisplay.textContent = `Editing: ${url}`;

            aceEditor.setReadOnly(true); // Disable while loading
            showStatus('Memuat data...', 'success');

            try {
                const res = await fetch(url);
                if (!res.ok) throw new Error('Network response was not ok');
                const data = await res.json();
                aceEditor.setValue(JSON.stringify(data, null, 2), -1);
                showStatus('Data dimuat berhasil', 'success');
            } catch (err) {
                showStatus('Gagal memuat data. Periksa URL atau CORS policy.', 'error');
                aceEditor.setValue('[]', -1);
            } finally {
                aceEditor.setReadOnly(false);
            }
        };

        const showStatus = (msg, type) => {
            statusMsg.textContent = msg;
            statusMsg.style.color = type === 'success' ? '#27ae60' : '#e74c3c';
            setTimeout(() => statusMsg.textContent = '', 4000);
        };

        // Navigation
        navBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                navBtns.forEach(b => b.classList.remove('active'));
                customApiBtn.classList.remove('active');
                btn.classList.add('active');
                const filename = btn.dataset.file;
                loadFile(`./aset/api/${filename}`, filename);
            });
        });

        // Custom API Modal logic
        customApiBtn.addEventListener('click', () => {
            modalOverlay.style.display = 'flex';
        });

        modalCancel.addEventListener('click', () => {
            modalOverlay.style.display = 'none';
        });

        modalConfirm.addEventListener('click', () => {
            const url = customUrlInput.value.trim();
            if (url) {
                navBtns.forEach(b => b.classList.remove('active'));
                customApiBtn.classList.add('active');
                modalOverlay.style.display = 'none';
                loadFile(url, url.split('/').pop() || 'custom.json');
            } else {
                alert('Silakan masukkan URL yang valid');
            }
        });

        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) modalOverlay.style.display = 'none';
        });

        // Toolbar Buttons
        document.getElementById('format-btn').addEventListener('click', () => {
            try {
                const content = aceEditor.getValue();
                const obj = JSON.parse(content);
                aceEditor.setValue(JSON.stringify(obj, null, 2), -1);
                showStatus('JSON dirapikan', 'success');
            } catch (err) {
                showStatus('JSON tidak valid!', 'error');
            }
        });

        document.getElementById('download-btn').addEventListener('click', () => {
            try {
                const content = aceEditor.getValue();
                const obj = JSON.parse(content);
                const blob = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = currentFile;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showStatus('File siap diunduh.', 'success');
            } catch (err) {
                showStatus('Gagal: JSON tidak valid!', 'error');
            }
        });

        // Upload functionality
        const uploadTrigger = document.getElementById('upload-trigger');
        const uploadInput = document.getElementById('upload-input');

        uploadTrigger.addEventListener('click', () => uploadInput.click());
        uploadInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const content = e.target.result;
                    JSON.parse(content); // Validate
                    aceEditor.setValue(content, -1);
                    showStatus('File dimuat ke editor.', 'success');
                } catch (err) {
                    showStatus('Gagal: File bukan JSON yang valid!', 'error');
                }
            };
            reader.readAsText(file);
        });

        // Dark mode support for theme
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            aceEditor.setTheme("ace/theme/tomorrow_night_eighties");
        } else {
            aceEditor.setTheme("ace/theme/chrome");
        }

        // Initialize
        loadFile('https://muslim-api-json.vercel.app/api/skenpat/search.json', 'search.json');
    </script>
</body>

</html>
